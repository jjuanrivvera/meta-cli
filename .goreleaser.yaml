version: 2
project_name: meta-cli
before:
  hooks: [go mod tidy, ./scripts/completions.sh]
builds:
  - id: metactl
    main: ./cmd/metactl
    binary: metactl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore: [{goos: windows, goarch: arm64}]
    ldflags:
      - -s -w
      - -X github.com/jjuanrivvera/meta-cli/internal/version.Version={{.Version}}
      - -X github.com/jjuanrivvera/meta-cli/internal/version.Commit={{.ShortCommit}}
      - -X github.com/jjuanrivvera/meta-cli/internal/version.Date={{.Date}}
archives:
  - ids: [metactl]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides: [{goos: windows, formats: [zip]}]
    files: [README.md, LICENSE, CHANGELOG.md, completions/*]
checksum: {name_template: checksums.txt}
snapshot: {version_template: "{{ incpatch .Version }}-next"}
homebrew_casks:
  - name: meta-cli
    binaries: [metactl]
    repository: {owner: jjuanrivvera, name: homebrew-meta-cli, token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"}
    homepage: https://github.com/jjuanrivvera/meta-cli
    description: Meta Business Graph API command line client
    license: MIT
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/metactl"]
scoops:
  - name: meta-cli
    repository: {owner: jjuanrivvera, name: scoop-meta-cli, token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"}
    homepage: https://github.com/jjuanrivvera/meta-cli
    description: Meta Business Graph API command line client
    license: MIT
nfpms:
  - ids: [metactl]
    package_name: meta-cli
    vendor: jjuanrivvera
    homepage: https://github.com/jjuanrivvera/meta-cli
    maintainer: Juan Rivera <jjuanrivvera@gmail.com>
    description: Meta Business Graph API command line client
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - {src: ./completions/metactl.bash, dst: /usr/share/bash-completion/completions/metactl, file_info: {mode: 0644}}
      - {src: ./completions/metactl.zsh, dst: /usr/share/zsh/site-functions/_metactl, file_info: {mode: 0644}}
      - {src: ./completions/metactl.fish, dst: /usr/share/fish/vendor_completions.d/metactl.fish, file_info: {mode: 0644}}
sboms: [{artifacts: archive}]
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args: [sign-blob, "--output-certificate=${certificate}", "--output-signature=${signature}", "${artifact}", --yes]
    artifacts: checksum
    output: true
release:
  github: {owner: jjuanrivvera, name: meta-cli}
  prerelease: auto
changelog:
  groups:
    - {title: Features, regexp: '^.*?feat(\(.+\))??!?:.+$', order: 0}
    - {title: Fixes, regexp: '^.*?fix(\(.+\))??!?:.+$', order: 1}
    - {title: Performance, regexp: '^.*?perf(\(.+\))??!?:.+$', order: 2}
  filters: {exclude: ['^docs:', '^test:', '^chore:', '^ci:', 'Merge pull request', 'Merge branch']}

