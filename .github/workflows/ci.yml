# CI — delegates fleet-wide checks to the canonical reusable workflow.
# Repo-specific acceptance gates stay here because they are not part of the shared surface.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: jjuanrivvera/.github/.github/workflows/go-ci.yml@main
    with:
      coverage-threshold: "80"
      # Command tests exercise internal packages through the fake Graph API.
      coverpkg: true
      run-gosec: true
      run-docs-check: true
      run-build: true

  gates:
    name: Acceptance gates (judge skipped)
    runs-on: ubuntu-latest
    env:
      # Hosted runners have no interactive agent binary. judge.sh logs the bypass visibly.
      CLIWRIGHT_SKIP_JUDGE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install gate dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep shellcheck
      - run: make build
      - name: Surface matches the manifest
        run: ./scripts/spec-check.sh
      - name: Manifest wraps the enumerated API
        run: ./scripts/spec-completeness.sh api-manifest.json 90
      - name: End-to-end tests
        run: make e2e
      - name: Definition of done
        run: ./scripts/dod-check.sh meta
      - name: Interactive judge intentionally skipped in CI
        run: make judge
      - name: Shell scripts
        run: shellcheck install.sh scripts/*.sh
